name: collect-and-deploy

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 05:17 KST (정각은 GitHub 예약 실행이 크게 밀리므로 피함)
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1단계: 테스트 → 수집 → 데이터 커밋 → 배포용 묶음 업로드
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps and run tests
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      - name: Collect data
        env:
          BIZINFO_CRTFC_KEY: ${{ secrets.BIZINFO_CRTFC_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python -m collector.build

      - name: Warn on partial source failure
        run: |
          python - <<'EOF'
          import json
          meta = json.load(open("site/data/meta.json", encoding="utf-8"))
          for name, s in meta["sources"].items():
              if not s["ok"]:
                  print(f"::warning::{name} 수집 실패 — 이전 데이터 사용: {s['error']}")
          EOF

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "데이터 변경 없음 — 커밋 생략"
          else
            git commit -m "data: daily refresh"
            git pull --rebase origin master
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages
          retention-days: 3

  # 2단계: 업로드된 묶음이 조회될 때까지 기다린 뒤 배포 (실패 시 이 작업만 재실행 가능)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              --jq '[.artifacts[] | select(.expired == false)] | length'); then
              if [ "$count" -ge 1 ]; then
                echo "Pages artifact is ready."
                exit 0
              fi
            fi
            echo "Waiting for artifact: $attempt/12"
            sleep 10
          done
          echo "::error::Pages artifact was not available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
